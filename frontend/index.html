<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minhas Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #eef6ef;
      --card: #ffffff;
      --text: #14301f;
      --muted: #4d6556;
      --primary: #15803d;
      --primary-dark: #166534;
      --soft: #dcfce7;
      --soft-2: #f4fbf5;
      --border: #cfe3d4;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app { max-width: 680px; margin: 0 auto; padding: 20px 16px 72px; }

    /* ---------- Cabeçalho (banner verde) ---------- */
    .hero {
      background: linear-gradient(135deg, #14532d 0%, #15803d 55%, #22a559 100%);
      color: #fff; border-radius: 22px; padding: 24px 22px 20px;
      box-shadow: 0 10px 24px rgba(21, 128, 61, .25);
    }
    .hero .greeting { margin: 0; font-weight: 600; opacity: .9; }
    .hero h1 { margin: 2px 0 14px; font-size: 1.9rem; font-weight: 800; letter-spacing: -.5px; }
    .progress-label { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
    .progress-track { height: 10px; background: rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: #bbf7d0; border-radius: 999px; transition: width .4s ease; }
    .status-line {
      min-height: 24px; margin: 12px 0 0; font-size: .88rem; opacity: .95;
      display: flex; align-items: center; gap: 8px;
    }

    /* ---------- Cartões ---------- */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-top: 16px;
      box-shadow: 0 2px 6px rgba(20, 83, 45, .06);
    }

    /* ---------- Formulário ---------- */
    .add-form label { display: block; font-weight: 700; margin-bottom: 8px; }
    .add-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 12px 14px; font: inherit; font-size: 1rem;
      border: 2px solid var(--border); border-radius: 12px; background: var(--soft-2); color: var(--text);
    }
    input[type="text"]:focus { border-color: var(--primary); background: #fff; outline: none; }
    input[type="text"].invalid { border-color: var(--danger); background: var(--danger-bg); }
    .field-hint { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
    .field-error { margin: 8px 0 0; font-size: .9rem; color: var(--danger); font-weight: 700; }

    button {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 10px 16px;
      border: 2px solid var(--border); background: #fff; color: var(--text);
      transition: background .15s, transform .05s;
    }
    button:hover:not(:disabled) { background: var(--soft); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 800; }
    button.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    button.danger { color: var(--danger); border-color: #f3c4c4; }
    button.danger:hover:not(:disabled) { background: var(--danger-bg); }

    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

    /* ---------- Filtros (pílulas) ---------- */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters button { border-radius: 999px; padding: 7px 14px; font-size: .92rem; }
    .filters button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ---------- Lista ---------- */
    ul.tasks { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
    .task {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--soft-2); border: 1px solid var(--border); border-left: 6px solid var(--primary);
      border-radius: 12px; transition: opacity .2s;
    }
    .task.done { border-left-color: #a7d7b6; opacity: .8; }
    .task.done .title { text-decoration: line-through; color: var(--muted); }
    .task .title { flex: 1; word-break: break-word; cursor: text; font-weight: 600; }
    .task .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .task .actions button { padding: 6px 11px; font-size: .88rem; }

    /* Checkbox redondo personalizado (continua sendo um checkbox real) */
    .task input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; flex-shrink: 0; cursor: pointer;
      width: 26px; height: 26px; border: 2px solid var(--primary); border-radius: 50%;
      background: #fff; display: grid; place-content: center; margin: 0;
    }
    .task input[type="checkbox"]::after {
      content: "✓"; color: #fff; font-size: 15px; font-weight: 800; transform: scale(0); transition: transform .15s;
    }
    .task input[type="checkbox"]:checked { background: var(--primary); }
    .task input[type="checkbox"]:checked::after { transform: scale(1); }

    .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
    .empty .big { font-size: 2.2rem; display: block; margin-bottom: 4px; }

    .list-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 8px; }
    .counter { color: var(--muted); font-size: .95rem; font-weight: 600; }

    .error-box { background: var(--danger-bg); border: 1px solid #f3c4c4; color: var(--danger); border-radius: 12px; padding: 16px; }
    .error-box p { margin: 0 0 10px; }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      animation: spin .8s linear infinite; display: inline-block;
    }
    .empty .spinner { border-color: var(--border); border-top-color: var(--primary); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Avisos ---------- */
    .toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(92vw, 420px); display: grid; gap: 8px; z-index: 10; }
    .toast {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #14301f; color: #fff; padding: 12px 14px; border-radius: 12px;
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
    }
    .toast.error { background: var(--danger); }
    .toast button { background: transparent; color: #fff; border-color: rgba(255,255,255,.55); padding: 4px 12px; }
    .toast button:hover:not(:disabled) { background: rgba(255,255,255,.18); }

    /* ---------- Ajuda ---------- */
    details.help summary { cursor: pointer; font-weight: 700; }
    details.help ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
    kbd { background: var(--soft); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: .85rem; }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
      .progress-fill, .task input[type="checkbox"]::after { transition: none; }
    }
    @media (max-width: 520px) {
      .task { flex-wrap: wrap; }
      .task .actions { width: 100%; justify-content: flex-end; }
      .add-row { flex-wrap: wrap; }
      .add-row input[type="text"] { flex-basis: 100%; }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script type="text/babel">
    // =====================================================================
    // CONFIGURAÇÃO: troque pela URL do seu backend na Vercel depois do deploy.
    // Exemplo: "https://tarefas-backend.vercel.app"  (sem barra no final)
    // =====================================================================
    const API_URL = "https://prova-gules-iota.vercel.app/";

    const { useState, useEffect, useRef, useCallback } = React;
    const MAX_LEN = 120;
    const UNDO_SECONDS = 5;

    // Camada de acesso à API, com mensagens de erro em linguagem simples (H9)
    async function api(path, options = {}) {
      let res;
      try {
        res = await fetch(API_URL + path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
      } catch (e) {
        throw new Error("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
      }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || "Algo deu errado. Tente novamente.");
      return data;
    }

    function validate(title) {
      if (!title.trim()) return "Digite um nome para a tarefa.";
      if (title.trim().length > MAX_LEN) return `Use no máximo ${MAX_LEN} caracteres.`;
      return "";
    }

    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? "Bom dia ☀️" : h < 18 ? "Boa tarde ☀️" : "Boa noite 🌙";
    }

    function App() {
      const [tasks, setTasks] = useState([]);
      const [loadState, setLoadState] = useState("loading"); // loading | ready | error
      const [loadError, setLoadError] = useState("");
      const [filter, setFilter] = useState("all");
      const [newTitle, setNewTitle] = useState("");
      const [formError, setFormError] = useState("");
      const [editingId, setEditingId] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editError, setEditError] = useState("");
      const [pendingOps, setPendingOps] = useState(0);
      const [toasts, setToasts] = useState([]);
      const inputRef = useRef(null);
      const timers = useRef({});

      // ---------- Avisos (H1: visibilidade do status do sistema) ----------
      const dismissToast = (id) => setToasts((t) => t.filter((x) => x.id !== id));
      const pushToast = useCallback((message, opts = {}) => {
        const id = Date.now() + Math.random();
        setToasts((t) => [...t, { id, message, ...opts }]);
        if (!opts.sticky) setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), (opts.seconds || 4) * 1000);
        return id;
      }, []);

      const track = async (fn) => {
        setPendingOps((n) => n + 1);
        try { return await fn(); } finally { setPendingOps((n) => n - 1); }
      };

      // ---------- READ ----------
      const loadTasks = useCallback(async () => {
        setLoadState("loading");
        try {
          setTasks(await api("/api/tasks"));
          setLoadState("ready");
        } catch (e) {
          setLoadError(e.message);
          setLoadState("error");
        }
      }, []);
      useEffect(() => { loadTasks(); }, [loadTasks]);

      // ---------- Atalho "/" para focar o campo (H7: eficiência) ----------
      useEffect(() => {
        const onKey = (e) => {
          const tag = (e.target.tagName || "").toLowerCase();
          if (e.key === "/" && tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            inputRef.current && inputRef.current.focus();
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      // ---------- CREATE ----------
      const addTask = async (e) => {
        e.preventDefault();
        const err = validate(newTitle);
        if (err) { setFormError(err); inputRef.current.focus(); return; } // H5 + H9
        setFormError("");
        try {
          const created = await track(() => api("/api/tasks", { method: "POST", body: JSON.stringify({ title: newTitle }) }));
          setTasks((t) => [...t, created]);
          setNewTitle("");
          pushToast("Tarefa adicionada.");
        } catch (e) {
          setFormError(e.message);
        }
      };

      // ---------- UPDATE (concluir / reabrir) ----------
      const toggleTask = async (task) => {
        const next = !task.done;
        setTasks((t) => t.map((x) => (x.id === task.id ? { ...x, done: next } : x))); // resposta imediata
        try {
          await track(() => api(`/api/tasks/${task.id}`, { method: "PUT", body: JSON.stringify({ done: next }) }));
        } catch (e) {
          setTasks((t) => t.map((x) => (x.id === task.id ? { ...x, done: task.done } : x)));
          pushToast(e.message, { type: "error", seconds: 6 });
        }
      };

      // ---------- UPDATE (editar título) ----------
      const startEdit = (task) => { setEditingId(task.id); setEditTitle(task.title); setEditError(""); };
      const cancelEdit = () => { setEditingId(null); setEditError(""); }; // H3: sair a qualquer momento
      const saveEdit = async (task) => {
        const err = validate(editTitle);
        if (err) { setEditError(err); return; }
        try {
          const updated = await track(() => api(`/api/tasks/${task.id}`, { method: "PUT", body: JSON.stringify({ title: editTitle }) }));
          setTasks((t) => t.map((x) => (x.id === task.id ? updated : x)));
          setEditingId(null);
          pushToast("Tarefa atualizada.");
        } catch (e) {
          setEditError(e.message);
        }
      };

      // ---------- DELETE com opção de desfazer (H3 + H5) ----------
      const removeTask = (task) => {
        setTasks((t) => t.filter((x) => x.id !== task.id));
        if (editingId === task.id) setEditingId(null);

        let toastId;
        timers.current[task.id] = setTimeout(async () => {
          delete timers.current[task.id];
          try {
            await track(() => api(`/api/tasks/${task.id}`, { method: "DELETE" }));
          } catch (e) {
            setTasks((t) => [...t, task].sort((a, b) => a.id - b.id));
            pushToast("Não foi possível excluir a tarefa. Ela foi restaurada.", { type: "error", seconds: 6 });
          }
        }, UNDO_SECONDS * 1000);

        toastId = pushToast(`"${task.title}" foi excluída.`, {
          seconds: UNDO_SECONDS,
          action: {
            label: "Desfazer",
            run: () => {
              clearTimeout(timers.current[task.id]);
              delete timers.current[task.id];
              setTasks((t) => [...t, task].sort((a, b) => a.id - b.id));
              dismissToast(toastId);
            },
          },
        });
      };

      const clearCompleted = async () => {
        const done = tasks.filter((t) => t.done);
        if (!window.confirm(`Excluir ${done.length} tarefa(s) concluída(s)? Esta ação não pode ser desfeita.`)) return;
        try {
          await track(() => Promise.all(done.map((t) => api(`/api/tasks/${t.id}`, { method: "DELETE" }))));
          setTasks((t) => t.filter((x) => !x.done));
          pushToast("Tarefas concluídas excluídas.");
        } catch (e) {
          pushToast(e.message, { type: "error", seconds: 6 });
          loadTasks();
        }
      };

      // ---------- Derivados ----------
      const pending = tasks.filter((t) => !t.done).length;
      const doneCount = tasks.length - pending;
      const percent = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
      const visible = tasks.filter((t) => filter === "all" ? true : filter === "pending" ? !t.done : t.done);
      const emptyMessage = tasks.length === 0
        ? ["Nada por aqui ainda. Faça sua primeira tarefa acima!"]
        : filter === "pending" ? ["🎉", "Tudo concluído por aqui. Bom trabalho!"]
        : ["Nenhuma tarefa concluída ainda."];

      return (
        <div className="app">
          <header className="hero">
            <p className="greeting">{greeting()}</p>

            <div className="progress-label">
              <span>{doneCount} de {tasks.length} concluídas</span>
              <span>{percent}%</span>
            </div>
            <div className="progress-track" role="progressbar" aria-label="Progresso das tarefas"
                 aria-valuemin={0} aria-valuemax={100} aria-valuenow={percent}>
              <div className="progress-fill" style={{ width: percent + "%" }}></div>
            </div>

            <div className="status-line" role="status" aria-live="polite">
              {pendingOps > 0
                ? <><span className="spinner" aria-hidden="true"></span> Salvando…</>
                : loadState === "ready" ? "✔ Tudo salvo" : ""}
            </div>
          </header>

          <main>
            <form className="card add-form" onSubmit={addTask} noValidate>
              <label htmlFor="new-task">O que vamos fazer hoje?</label>
              <div className="add-row">
                <input
                  id="new-task" ref={inputRef} type="text" value={newTitle} maxLength={MAX_LEN + 20}
                  placeholder="Ex.: Estudar React por 30 minutos"
                  className={formError ? "invalid" : ""}
                  aria-invalid={!!formError} aria-describedby="new-task-msg"
                  onChange={(e) => { setNewTitle(e.target.value); if (formError) setFormError(""); }}
                />
                <button type="submit" className="primary">＋ Adicionar</button>
              </div>
              <div id="new-task-msg">
                {formError
                  ? <p className="field-error" role="alert">{formError}</p>
                  : <p className="field-hint">{newTitle.trim().length}/{MAX_LEN} caracteres · Pressione Enter para adicionar</p>}
              </div>
            </form>

            <section className="card" aria-label="Lista de tarefas">
              <div className="filters" role="group" aria-label="Filtrar tarefas">
                {[["all", "Todas", tasks.length], ["pending", "Pendentes", pending], ["done", "Concluídas", doneCount]].map(([key, label, n]) => (
                  <button key={key} aria-pressed={filter === key} onClick={() => setFilter(key)}>{label} ({n})</button>
                ))}
              </div>

              {loadState === "loading" && (
                <p className="empty"><span className="spinner" aria-hidden="true"></span> Carregando suas tarefas… (na primeira visita o servidor pode levar alguns segundos)</p>
              )}

              {loadState === "error" && (
                <div className="error-box" role="alert" style={{ marginTop: 12 }}>
                  <p><strong>Não conseguimos carregar suas tarefas.</strong></p>
                  <p>{loadError}</p>
                  <button onClick={loadTasks}>Tentar novamente</button>
                </div>
              )}

              {loadState === "ready" && (
                <>
                  {visible.length === 0 ? (
                    <p className="empty"><span className="big" aria-hidden="true">{emptyMessage[0]}</span>{emptyMessage[1]}</p>
                  ) : (
                    <ul className="tasks">
                      {visible.map((task) => (
                        <li key={task.id} className={"task" + (task.done ? " done" : "")}>
                          {editingId === task.id ? (
                            <div style={{ flex: 1 }}>
                              <div className="add-row">
                                <input
                                  type="text" autoFocus value={editTitle} aria-label="Editar nome da tarefa"
                                  className={editError ? "invalid" : ""}
                                  onChange={(e) => { setEditTitle(e.target.value); setEditError(""); }}
                                  onKeyDown={(e) => { if (e.key === "Enter") saveEdit(task); if (e.key === "Escape") cancelEdit(); }}
                                />
                                <button className="primary" onClick={() => saveEdit(task)}>Salvar</button>
                                <button onClick={cancelEdit}>Cancelar</button>
                              </div>
                              {editError && <p className="field-error" role="alert">{editError}</p>}
                            </div>
                          ) : (
                            <>
                              <input
                                type="checkbox" checked={task.done} onChange={() => toggleTask(task)}
                                aria-label={`${task.done ? "Reabrir" : "Concluir"} tarefa: ${task.title}`}
                              />
                              <span className="title" title="Dê dois cliques para editar" onDoubleClick={() => startEdit(task)}>
                                {task.title}
                              </span>
                              <div className="actions">
                                <button onClick={() => startEdit(task)} aria-label={`Editar tarefa: ${task.title}`}>✏️ Editar</button>
                                <button className="danger" onClick={() => removeTask(task)} aria-label={`Excluir tarefa: ${task.title}`}>🗑️ Excluir</button>
                              </div>
                            </>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}

                  <div className="list-footer">
                    <span className="counter">
                      {pending === 0 ? "Nenhuma tarefa pendente" : `${pending} ${pending === 1 ? "tarefa pendente" : "tarefas pendentes"}`}
                    </span>
                    {doneCount > 0 && <button className="danger" onClick={clearCompleted}>Excluir concluídas</button>}
                  </div>
                </>
              )}
            </section>

            {/* H10: ajuda e documentação */}
            <details className="card help">
              <summary>Ajuda e atalhos</summary>
              <ul>
                <li>Marque a bolinha para concluir uma tarefa; desmarque para reabrir.</li>
                <li>Dê <strong>dois cliques</strong> no texto (ou use “Editar”) para mudar o nome.</li>
                <li>Excluiu sem querer? Use <strong>Desfazer</strong> no aviso que aparece por {UNDO_SECONDS} segundos.</li>
                <li><kbd>/</kbd> vai direto para o campo de nova tarefa.</li>
                <li><kbd>Enter</kbd> salva · <kbd>Esc</kbd> cancela a edição.</li>
              </ul>
            </details>
          </main>

          <div className="toasts" aria-live="polite">
            {toasts.map((t) => (
              <div key={t.id} className={"toast" + (t.type === "error" ? " error" : "")} role={t.type === "error" ? "alert" : "status"}>
                <span>{t.message}</span>
                {t.action && <button onClick={t.action.run}>{t.action.label}</button>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
